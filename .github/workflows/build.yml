name: Build

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      os:
        required: true
        type: string
      buildArgs:
        required: true
        type: string
      assetType:
        required: true
        type: string
      artifactName:
        required: true
        type: string
      artifactPath:
        required: true
        type: string
    secrets:
      SE_KEYSTORE_FILE:
        required: false
      SE_KEYSTORE_INFO_FILE:
        required: false

env:
  HAXE_VERSION: 4.3.7
  PROJECT_NAME: ShadowEngine

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          submodules: true

      - name: Setup Haxe
        uses: ShadowEngineTeam/setup-haxe@main
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install Dependencies for Linux
        if: ${{ startsWith(inputs.name, 'Linux') }}
        shell: bash
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          case "${{ inputs.name }}" in
            "Linux i686")
              sudo dpkg --add-architecture i386
              sudo apt update
              sudo apt install -y clang-22 lld-22 gcc-12-i686-linux-gnu g++-12-i686-linux-gnu libvlc-dev:i386 libvlccore-dev:i386
              ;;
            "Linux ARMV7")
              sudo dpkg --add-architecture armhf
              sudo apt update
              sudo apt install -y clang-22 lld-22 gcc-12-arm-linux-gnueabihf g++-12-arm-linux-gnueabihf libvlc-dev:armhf libvlccore-dev:armhf
              ;;
            "Linux x86_64"|"Linux ARM64")
              sudo apt update
              sudo apt install -y clang-22 lld-22 gcc-12 g++-12 libvlc-dev libvlccore-dev
              ;;
          esac

      - name: Install Libraries
        shell: bash
        run: |
          haxelib git hmm https://github.com/ShadowEngineTeam/hmm --skip-dependencies --quiet
          haxelib run hmm install --quiet

      - name: Configure Android
        if: ${{ inputs.name == 'Android' }}
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_LATEST_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_21_arm64
          haxelib run lime config ANDROID_SETUP true

      - name: Extract Android keystore
        if: ${{ inputs.name == 'Android' && github.repository_owner == 'ShadowEngineTeam' }}
        shell: bash
        env:
          SE_KEYSTORE_FILE: ${{ secrets.SE_KEYSTORE_FILE }}
          SE_KEYSTORE_INFO_FILE: ${{ secrets.SE_KEYSTORE_INFO_FILE }}
        run: |
          echo "$SE_KEYSTORE_FILE" | base64 --decode > keystore/android/key.keystore
          echo "$SE_KEYSTORE_INFO_FILE" | base64 --decode > keystore/android/keystore.json

      - name: Compile
        shell: bash
        run: |
          case "${{ inputs.name }}" in
            "Linux ARMV7")
              CC="clang-22 --target=arm-linux-gnueabihf" CXX="clang++-22 --target=arm-linux-gnueabihf" linux32 haxelib run lime build ${{ inputs.buildArgs }} -D ${{ inputs.assetType }}
              ;;
            "Linux i686")
              CC="clang-22 --target=i686-linux-gnu" CXX="clang++-22 --target=i686-linux-gnu" linux32 haxelib run lime build ${{ inputs.buildArgs }} -D ${{ inputs.assetType }}
              ;;
            "Linux x86_64"|"Linux ARM64")
              CC="clang-22" CXX="clang++-22" haxelib run lime build ${{ inputs.buildArgs }} -D ${{ inputs.assetType }}
              ;;
            *)
              haxelib run lime build ${{ inputs.buildArgs }} -D ${{ inputs.assetType }}
              ;;
          esac

      - name: Install ldid
        if: startsWith(inputs.name, 'iOS')
        shell: bash
        run: |
          brew update

          if brew tap | grep -q "aws/tap"; then
            brew tap --repair
            brew untap aws/tap 2>/dev/null || true
            brew tap aws/tap
          fi

          brew install ldid || {
            brew tap --force homebrew/core || true
            brew install ldid
          }

      - name: Make IPA
        if: startsWith(inputs.name, 'iOS')
        shell: bash
        run: |
          if ! command -v ldid &> /dev/null; then
            echo "ldid not found, installing..."
            brew install ldid
          fi
          
          for config in Debug-iphoneos Debug-iphonesimulator Release-iphoneos Release-iphonesimulator; do
            if [ ! -d "export/release/ios/build/$config" ]; then
              continue
            fi
            cd "export/release/ios/build/$config/${{ env.PROJECT_NAME }}.app"
            if [ -d Frameworks ]; then
              for fw in Frameworks/*.framework; do
                name=$(basename "$fw" .framework)
                if [ -f "$fw/$name" ]; then
                  ldid -S "$fw/$name"
                fi
              done
            fi
            ldid -S../../../${{ env.PROJECT_NAME }}/${{ env.PROJECT_NAME }}.entitlements ${{ env.PROJECT_NAME }}
            if [ -d Frameworks ]; then
              for fw in Frameworks/*.framework; do
                name=$(basename "$fw" .framework)
                if [ -f "$fw/$name" ]; then
                  echo "== entitlements: $name =="
                  ldid -e "$fw/$name"
                  echo "========================="
                fi
              done
            fi
            echo "== entitlements: ${{ env.PROJECT_NAME }} =="
            ldid -e ${{ env.PROJECT_NAME }}
            echo "========================="
            cd ..
            mkdir Payload
            mv ${{ env.PROJECT_NAME }}.app Payload
            zip -r ${{ env.PROJECT_NAME }}.ipa Payload
            rm -rf Payload
            cd ../../../../../..
          done

      - name: Upload Artifact
        uses: actions/upload-artifact@main
        with:
          name: ${{ inputs.artifactName }}-${{ inputs.assetType }}
          path: ${{ inputs.artifactPath }}
          if-no-files-found: error
